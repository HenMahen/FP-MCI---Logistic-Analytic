version: 2

models:
  - name: stg_orders
    description: >
      Silver orders. Keeps delivered orders with complete SLA timestamps,
      normalises the status text, and enforces one row per order_id.
    columns:
      - name: order_id
        description: Order business key (primary key of this model).
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer identifier used to join the customer dimension.
        tests:
          - not_null
      - name: order_status
        description: Normalised status. Always "delivered" in this model.
        tests:
          - accepted_values:
              arguments:
                values: ["delivered"]
      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
        tests:
          - not_null
      - name: order_approved_at
        description: Payment approval timestamp.
        tests:
          - not_null
      - name: order_delivered_carrier_date
        description: Timestamp when the order was handed to the carrier.
        tests:
          - not_null
      - name: order_delivered_customer_date
        description: Timestamp when the customer received the order.
        tests:
          - not_null
      - name: order_estimated_delivery_date
        description: Delivery promise date shown to the customer.
        tests:
          - not_null

  - name: stg_order_items
    description: >
      Silver order line items with a composite surrogate key
      (order_id + order_item_id) and non-negative price and freight.
    columns:
      - name: order_item_sk
        description: Deterministic composite key `order_id-order_item_id`.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to the order.
        tests:
          - not_null
      - name: order_item_id
        description: Sequential line number inside the order.
        tests:
          - not_null
      - name: product_id
        description: Product identifier for the line item.
        tests:
          - not_null
      - name: seller_id
        description: Seller that fulfilled the line item.
        tests:
          - not_null
      - name: price
        description: Item price in BRL (zero when the source is null).
        tests:
          - not_null
      - name: freight_value
        description: Freight charged in BRL (zero when the source is null).
        tests:
          - not_null

  - name: stg_customers
    description: >
      Silver customer master with normalised city, state, and ZIP prefix.
      One row per customer_id.
    columns:
      - name: customer_id
        description: Primary key used by orders.
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Stable customer identity across repeat purchases.
      - name: customer_zip_code_prefix
        description: Five-digit ZIP prefix used to join geolocation.
        tests:
          - not_null
      - name: customer_city
        description: Lower-cased customer city.
        tests:
          - not_null
      - name: customer_state
        description: Two-letter Brazilian state code.
        tests:
          - not_null

  - name: stg_sellers
    description: >
      Silver seller master with normalised location. One row per seller_id.
    columns:
      - name: seller_id
        description: Primary key of the seller.
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: Five-digit ZIP prefix of the seller.
        tests:
          - not_null
      - name: seller_city
        description: Lower-cased seller city.
        tests:
          - not_null
      - name: seller_state
        description: Two-letter Brazilian state code of the seller.
        tests:
          - not_null

  - name: stg_products
    description: >
      Silver product catalogue. Legacy typo columns are renamed, missing
      categories become "unknown", and missing dimensions become zero.
    columns:
      - name: product_id
        description: Primary key of the product.
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: Normalised category; never null.
        tests:
          - not_null
      - name: product_weight_g
        description: Product weight in grams. Zero means not informed.
        tests:
          - not_null

  - name: stg_geolocation
    description: >
      Silver geolocation lookup with one averaged coordinate per ZIP prefix.
      Raw points outside Brazil's bounding box are removed.
    columns:
      - name: geolocation_zip_code_prefix
        description: Primary key of the geolocation lookup.
        tests:
          - unique
          - not_null
      - name: lat
        description: Mean latitude of all valid points for the ZIP prefix.
        tests:
          - not_null
      - name: lng
        description: Mean longitude of all valid points for the ZIP prefix.
        tests:
          - not_null

  - name: stg_order_reviews
    description: >
      Silver reviews. Invalid scores outside 1-5 are dropped and duplicate
      review_id rows are removed.
    columns:
      - name: review_id
        description: Primary key of the review.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Order that the review belongs to.
        tests:
          - not_null
      - name: review_score
        description: Customer rating from 1 (worst) to 5 (best).
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
