# dbt project — DustiniaDelixia Groceria
# Medallion architecture: Bronze (Airflow) -> Silver (staging/intermediate) -> Gold (marts)
name: "dustinadelixia_groceria"
version: "1.0.0"
config-version: 2

profile: "dustinadelixia_groceria"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dustinadelixia_groceria:
    staging:
      +materialized: view
      +schema: silver
      +tags: ["silver", "staging"]
    intermediate:
      +materialized: table
      +schema: silver
      +tags: ["silver", "intermediate"]
    marts:
      +materialized: table
      +schema: gold
      +tags: ["gold", "marts"]

vars:
  delivered_status: "delivered"
